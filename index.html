<title>前端八股文知识库</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sidebar-w: 300px;
    --bg: #1a1a2e;
    --sidebar-bg: #16213e;
    --card-bg: #0f3460;
    --accent: #e94560;
    --text: #eee;
    --text-dim: #aab;
    --border: #233;
  }

  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ===== Sidebar ===== */
  .sidebar {
    width: var(--sidebar-w);
    min-width: var(--sidebar-w);
    background: var(--sidebar-bg);
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    overflow: hidden;
  }

  .sidebar-header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }

  .sidebar-header h1 {
    font-size: 1.2rem;
    margin-bottom: 10px;
  }

  .sidebar-header input {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    font-size: 0.9rem;
    outline: none;
  }

  .sidebar-header input:focus { border-color: var(--accent); }

  .sidebar-nav {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
  }

  .sidebar-nav::-webkit-scrollbar { width: 4px; }
  .sidebar-nav::-webkit-scrollbar-thumb { background: #335; border-radius: 2px; }

  .cat-group { margin-bottom: 4px; }

  .cat-title {
    display: flex;
    align-items: center;
    padding: 8px 16px;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--accent);
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
  }

  .cat-title:hover { background: rgba(255,255,255,0.05); }
  .cat-title .arrow { margin-right: 6px; font-size: 0.7rem; transition: transform 0.2s; }
  .cat-title.open .arrow { transform: rotate(90deg); }
  .cat-title .count { margin-left: auto; font-size: 0.75rem; color: var(--text-dim); font-weight: 400; }

  .cat-items { display: none; }
  .cat-items.open { display: block; }

  .cat-items a {
    display: block;
    padding: 6px 16px 6px 32px;
    color: var(--text-dim);
    text-decoration: none;
    font-size: 0.82rem;
    transition: all 0.15s;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cat-items a:hover { color: #fff; background: rgba(255,255,255,0.05); }
  .cat-items a.active { color: #fff; background: var(--accent); border-radius: 4px; margin: 1px 8px; padding-left: 24px; }

  .stats {
    padding: 10px 16px;
    font-size: 0.75rem;
    color: var(--text-dim);
    border-top: 1px solid var(--border);
  }

  /* ===== Main Content ===== */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .topbar {
    display: flex;
    align-items: center;
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    gap: 10px;
    flex-shrink: 0;
  }

  .topbar .breadcrumb { font-size: 0.85rem; color: var(--text-dim); flex: 1; }
  .topbar .breadcrumb span { color: var(--accent); }

  .nav-btn {
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
    transition: background 0.2s;
  }

  .nav-btn:hover { background: var(--accent); }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }

  .content {
    flex: 1;
    overflow-y: auto;
    padding: 30px 40px 60px;
  }

  .content::-webkit-scrollbar { width: 6px; }
  .content::-webkit-scrollbar-thumb { background: #335; border-radius: 3px; }

  /* ===== Markdown 样式 ===== */
  .content h1 { font-size: 1.8rem; margin: 0 0 20px; color: var(--accent); border-bottom: 2px solid var(--accent); padding-bottom: 8px; }
  .content h2 { font-size: 1.4rem; margin: 28px 0 12px; color: #f0a; }
  .content h3 { font-size: 1.15rem; margin: 20px 0 8px; }
  .content h4 { font-size: 1rem; margin: 16px 0 6px; color: var(--text-dim); }
  .content p { line-height: 1.8; margin: 8px 0; }
  .content ul, .content ol { padding-left: 24px; margin: 8px 0; }
  .content li { line-height: 1.7; margin: 3px 0; }
  .content a { color: #5af; }
  .content strong { color: #ff9; }
  .content em { color: var(--text-dim); }
  .content img { max-width: 100%; border-radius: 8px; margin: 12px 0; }

  .content code {
    background: rgba(255,255,255,0.08);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: "Fira Code", "SF Mono", monospace;
    font-size: 0.88em;
    color: #f8c;
  }

  .content pre {
    background: #0d1117;
    padding: 16px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 12px 0;
    border: 1px solid #222;
  }

  .content pre code {
    background: none;
    padding: 0;
    color: #c9d1d9;
    font-size: 0.85rem;
    line-height: 1.6;
  }

  .content table { border-collapse: collapse; width: 100%; margin: 12px 0; }
  .content th, .content td { border: 1px solid #334; padding: 8px 12px; text-align: left; font-size: 0.88rem; }
  .content th { background: var(--card-bg); color: var(--accent); }
  .content tr:hover { background: rgba(255,255,255,0.03); }

  .content blockquote {
    border-left: 3px solid var(--accent);
    padding: 8px 16px;
    margin: 12px 0;
    background: rgba(233,69,96,0.08);
    border-radius: 0 6px 6px 0;
  }

  .content hr { border: none; border-top: 1px solid #334; margin: 24px 0; }

  /* Welcome */
  .welcome { text-align: center; margin-top: 15vh; }
  .welcome h1 { border: none; font-size: 2.2rem; }
  .welcome p { color: var(--text-dim); font-size: 1.1rem; margin: 12px 0; }
  .welcome .tag { display: inline-block; background: var(--card-bg); padding: 4px 12px; border-radius: 20px; margin: 4px; font-size: 0.8rem; }

  /* ===== Mobile ===== */
  .menu-toggle {
    display: none;
    position: fixed;
    top: 10px; left: 10px;
    z-index: 200;
    background: var(--accent);
    border: none;
    color: #fff;
    width: 40px; height: 40px;
    border-radius: 8px;
    font-size: 1.3rem;
    cursor: pointer;
  }

  @media (max-width: 768px) {
    .sidebar {
      position: fixed;
      left: -100%;
      top: 0;
      height: 100%;
      z-index: 100;
      transition: left 0.3s;
    }
    .sidebar.show { left: 0; }
    .menu-toggle { display: block; }
    .content { padding: 20px 16px 60px; }
  }
</style>
</head>

<main class="main">

    <button class="nav-btn" id="nextBtn" disabled onclick="navPage(1)">下一篇 →</button>
  </div>
  <div class="content" id="content">

      <p>点击左侧目录开始翻阅，或使用搜索快速定位</p>
      <div id="tags"></div>
    </div>
  </div>
</main>

  let catalog = {};
  let flatList = [];
  let currentIndex = -1;

  // ===== 加载目录（内联 + fetch 双模式，兼容 file:// 协议） =====
  async function init() {
    try {
      const res = await fetch("catalog.json");
      catalog = await res.json();
    } catch {
      // file:// 协议下 fetch 会失败，使用内联数据
      catalog = INLINE_CATALOG;
    }

    // 构建扁平列表（用于前后翻页）
    flatList = [];
    for (const [cat, files] of Object.entries(catalog)) {
      for (const file of files) {
        const path = cat === "_root" ? file : `${cat}/${file}`;
        flatList.push({ cat, file, path });
      }
    }

    renderNav(catalog);
    document.getElementById("totalCount").innerText = flatList.length;
    document.getElementById("stats").innerText = `共 ${Object.keys(catalog).length} 个分类，${flatList.length} 篇文档`;

    // 渲染标签
    const tags = document.getElementById("tags");
    for (const [key, name] of Object.entries(CAT_NAMES)) {
      if (catalog[key]) {
        tags.innerHTML += `<span class="tag">${CAT_ICONS[key] || ""} ${name} (${catalog[key].length})</span> `;
      }
    }

    // URL hash 导航
    if (location.hash) {
      const path = decodeURIComponent(location.hash.slice(1));
      loadDoc(path);
    }
  }

  // ===== HTML 转义 =====
  function esc(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  // ===== 渲染侧边栏 =====
  function renderNav(data, filter = "") {
    const nav = document.getElementById("nav");
    let html = "";
    for (const [cat, files] of Object.entries(data)) {
      const name = CAT_NAMES[cat] || cat;
      const icon = CAT_ICONS[cat] || "📁";
      const filtered = filter
        ? files.filter(f => f.toLowerCase().includes(filter))
        : files;
      if (filter && filtered.length === 0) continue;

      html += `<div class="cat-group">
        <div class="cat-title ${filter ? 'open' : ''}" onclick="toggleCat(this)">
          <span class="arrow">▶</span>${icon} ${esc(name)}<span class="count">${filtered.length}</span>
        </div>
        <div class="cat-items ${filter ? 'open' : ''}">`;
      for (const file of filtered) {
        const path = cat === "_root" ? file : `${cat}/${file}`;
        const label = file.replace(/\.md$/, "");
        html += `<a href="#${encodeURIComponent(path)}" onclick="loadDoc(decodeURIComponent('${encodeURIComponent(path)}')); return false;" title="${esc(label)}">${esc(label)}</a>`;
      }
      html += `</div></div>`;
    }
    nav.innerHTML = html;
  }

  function toggleCat(el) {
    el.classList.toggle("open");
    el.nextElementSibling.classList.toggle("open");
  }

  // ===== 加载文档 =====
  async function loadDoc(path) {
    const contentEl = document.getElementById("content");
    const breadcrumb = document.getElementById("breadcrumb");

    try {
      const res = await fetch(`docs/${encodeURIComponent(path)}`);
      if (!res.ok) throw new Error("Not found");
      const md = await res.text();
      contentEl.innerHTML = marked.parse(md);
      contentEl.scrollTop = 0;

      // 更新面包屑
      const parts = path.replace(/\.md$/, "").split("/");
      if (parts.length > 1) {
        const catName = CAT_NAMES[parts[0]] || parts[0];
        breadcrumb.innerHTML = `<span>${esc(catName)}</span> / ${esc(parts.slice(1).join(" / "))}`;
      } else {
        breadcrumb.innerHTML = `<span>综合专题</span> / ${esc(parts[0].replace(/\.md$/, ""))}`;
      }

      // 更新当前索引
      currentIndex = flatList.findIndex(item => item.path === path);
      updateNavButtons();
      updateActiveLink(path);

      // URL hash
      history.replaceState(null, "", `#${encodeURIComponent(path)}`);

      // 移动端关闭侧边栏
      document.getElementById("sidebar").classList.remove("show");

    } catch (e) {
      contentEl.innerHTML = `<p style="color:var(--accent)">无法加载文档: ${path}</p>`;
    }
  }

  function updateActiveLink(path) {
    document.querySelectorAll(".cat-items a").forEach(a => a.classList.remove("active"));
    const target = document.querySelector(`.cat-items a[href="#${CSS.escape(encodeURIComponent(path))}"]`);
    if (target) {
      target.classList.add("active");
      // 展开所在分类
      const group = target.closest(".cat-group");
      if (group) {
        group.querySelector(".cat-title").classList.add("open");
        group.querySelector(".cat-items").classList.add("open");
      }
    }
  }

  // ===== 前后翻页 =====
  function navPage(dir) {
    const newIndex = currentIndex + dir;
    if (newIndex >= 0 && newIndex < flatList.length) {
      loadDoc(flatList[newIndex].path);
    }
  }

  function updateNavButtons() {
    document.getElementById("prevBtn").disabled = currentIndex <= 0;
    document.getElementById("nextBtn").disabled = currentIndex >= flatList.length - 1;
  }

  // ===== 搜索 =====
  document.getElementById("search").addEventListener("input", function () {
    const q = this.value.trim().toLowerCase();
    renderNav(catalog, q);
  });

  // ===== 键盘导航 =====
  document.addEventListener("keydown", function (e) {
    if (e.target.tagName === "INPUT") return;
    if (e.key === "ArrowLeft") navPage(-1);
    if (e.key === "ArrowRight") navPage(1);
  });

  // ===== 移动端菜单 =====
  document.getElementById("menuToggle").addEventListener("click", function () {
    document.getElementById("sidebar").classList.toggle("show");
  });

  init();
</script>
